<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Arbeidssystemets deler</title><desc id="desc">Originalkilder gir grunnlag til KI. KI leser og vedlikeholder saksforståelse og oppgaver. Oppgaver brukes i ukeplan. Mennesket velger og godkjenner.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#244B68"/></marker><marker id="back" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,0 L0,5 L10,10 Z" fill="#244B68"/></marker></defs><rect width="1200" height="800" fill="white"/><text x="36" y="60" fill="#202020" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="start"><tspan x="36" dy="0">Arbeidssystemets deler</tspan></text><rect x="420" y="110" width="360" height="105" fill="#F3F3F3" stroke="#CCCCCC" stroke-width="2"/><text x="444" y="153" fill="#202020" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="444" dy="0">Originalkilder</tspan></text><text x="444" y="192" fill="#202020" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="444" dy="0">Dokumenter og data</tspan></text><path d="M600,216 L600,277" stroke="#244B68" stroke-width="4" fill="none" marker-end="url(#arrow)" /><rect x="420" y="280" width="360" height="145" fill="#127C80" stroke="#127C80" stroke-width="2"/><text x="444" y="323" fill="white" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="444" dy="0">KI som partner</tspan></text><text x="444" y="362" fill="white" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="444" dy="0">Forstår og foreslår</tspan><tspan x="444" dy="32.5">Utfører innen fullmakt</tspan></text><rect x="25" y="280" width="320" height="145" fill="#F3F3F3" stroke="#CCCCCC" stroke-width="2"/><text x="49" y="323" fill="#202020" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="49" dy="0">Varig kunnskap</tspan></text><text x="49" y="362" fill="#202020" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="49" dy="0">Sak og område</tspan><tspan x="49" dy="32.5">Kilder og historikk</tspan></text><path d="M350,350 L414,350" stroke="#244B68" stroke-width="4" fill="none" marker-end="url(#arrow)" marker-start="url(#back)"/><rect x="855" y="280" width="320" height="145" fill="#F3F3F3" stroke="#CCCCCC" stroke-width="2"/><text x="879" y="323" fill="#202020" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="879" dy="0">Oppgavekø</tspan></text><text x="879" y="362" fill="#202020" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="879" dy="0">Eier og neste handling</tspan><tspan x="879" dy="32.5">Frist og ferdigkriterium</tspan></text><path d="M786,350 L849,350" stroke="#244B68" stroke-width="4" fill="none" marker-end="url(#arrow)" marker-start="url(#back)"/><rect x="420" y="505" width="360" height="110" fill="#F3F3F3" stroke="#CCCCCC" stroke-width="2"/><text x="444" y="548" fill="#202020" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="444" dy="0">Leveranse</tspan></text><text x="444" y="587" fill="#202020" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="444" dy="0">Lagre og les tilbake</tspan></text><path d="M600,431 L600,499" stroke="#244B68" stroke-width="4" fill="none" marker-end="url(#arrow)" /><rect x="855" y="505" width="320" height="110" fill="#F3F3F3" stroke="#CCCCCC" stroke-width="2"/><text x="879" y="548" fill="#202020" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="879" dy="0">Ukeplan og visning</tspan></text><text x="879" y="587" fill="#202020" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="879" dy="0">Fokus og kapasitet</tspan></text><path d="M1015,431 L1015,499" stroke="#244B68" stroke-width="4" fill="none" marker-end="url(#arrow)" /><text x="30" y="540" fill="#244B68" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start"><tspan x="30" dy="0">Neste økt starter med</tspan><tspan x="30" dy="35.1">lagret kontekst og</tspan><tspan x="30" dy="35.1">korrekt oppgavestatus.</tspan></text><text x="36" y="708" fill="#127C80" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start"><tspan x="36" dy="0">Mennesket eier prioriteringer, fullmakter og beslutninger.</tspan></text><text x="36" y="756" fill="#202020" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start"><tspan x="36" dy="0">Pilene viser arbeidsflyt. Teknisk tilgang må prøves i ditt miljø.</tspan></text></svg>