<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Finn riktig detaljnivå</title><desc id="desc">START ruter til en sak eller et område. Oversikten peker ved behov til historikk og original. Ny kunnskap oppdaterer den relevante eieren.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#244B68"/></marker><marker id="back" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,0 L0,5 L10,10 Z" fill="#244B68"/></marker></defs><rect width="1200" height="800" fill="white"/><text x="36" y="60" fill="#202020" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="start"><tspan x="36" dy="0">Finn riktig detaljnivå</tspan></text><rect x="40" y="130" width="410" height="125" fill="#127C80" stroke="#127C80" stroke-width="2"/><text x="64" y="173" fill="white" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="64" dy="0">START</tspan></text><text x="64" y="212" fill="white" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Kort inngang og rutekart</tspan></text><path d="M245,261 L245,320" stroke="#244B68" stroke-width="4" fill="none" marker-end="url(#arrow)" /><rect x="40" y="325" width="410" height="145" fill="#F3F3F3" stroke="#CCCCCC" stroke-width="2"/><text x="64" y="368" fill="#202020" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="64" dy="0">Sak eller område</tspan></text><text x="64" y="407" fill="#202020" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Mål, nåstatus og myndighet</tspan><tspan x="64" dy="32.5">Pekere til nødvendig dybde</tspan></text><path d="M455,395 L650,395" stroke="#244B68" stroke-width="4" fill="none" marker-end="url(#arrow)" /><text x="490" y="370" fill="#244B68" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start"><tspan x="490" dy="0">Ved behov</tspan></text><rect x="655" y="325" width="505" height="145" fill="#F3F3F3" stroke="#CCCCCC" stroke-width="2"/><text x="679" y="368" fill="#202020" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="679" dy="0">Indeks og historikk</tspan></text><text x="679" y="407" fill="#202020" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="679" dy="0">Bakgrunn og hendelser</tspan><tspan x="679" dy="32.5">Begrunnede sammenhenger</tspan></text><path d="M245,476 L245,560" stroke="#244B68" stroke-width="4" fill="none" marker-end="url(#arrow)" /><path d="M905,476 L905,560" stroke="#244B68" stroke-width="4" fill="none" marker-end="url(#arrow)" /><rect x="40" y="565" width="1120" height="125" fill="#F3F3F3" stroke="#CCCCCC" stroke-width="2"/><text x="64" y="608" fill="#202020" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="64" dy="0">Autoritativ original</tspan></text><text x="64" y="647" fill="#202020" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Kontroller ved ferskhet, regelgrunnlag, dokumentasjon eller høy konsekvens.</tspan></text><text x="40" y="752" fill="#127C80" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="40" dy="0">Utvid lesingen til grunnlaget er tilstrekkelig. Bevar relevant historikk.</tspan></text></svg>