<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Et innspill får riktig hjem</title><desc id="desc">Råstoff vurderes mot kilde og eksisterende sak. Handling går til oppgavekø, kunnskap til sak og formell beslutning til riktig myndighet. Lagring og konsekvenser kontrolleres.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#244B68"/></marker><marker id="back" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,0 L0,5 L10,10 Z" fill="#244B68"/></marker></defs><rect width="1200" height="800" fill="white"/><text x="36" y="60" fill="#202020" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="start"><tspan x="36" dy="0">Et innspill får riktig hjem</tspan></text><rect x="35" y="125" width="330" height="135" fill="#F3F3F3" stroke="#CCCCCC" stroke-width="2"/><text x="59" y="168" fill="#202020" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="59" dy="0">Nytt innspill</tspan></text><text x="59" y="207" fill="#202020" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="59" dy="0">Notat, dokument</tspan><tspan x="59" dy="32.5">eller samtale</tspan></text><path d="M370,192 L490,192" stroke="#244B68" stroke-width="4" fill="none" marker-end="url(#arrow)" /><rect x="495" y="125" width="665" height="135" fill="#127C80" stroke="#127C80" stroke-width="2"/><text x="519" y="168" fill="white" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="519" dy="0">Forstå og kontrollere</tspan></text><text x="519" y="207" fill="white" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="519" dy="0">Kilde, dato, eksisterende sak og faktisk eier</tspan></text><path d="M825,266 L825,305" stroke="#244B68" stroke-width="4" fill="none" marker-end="url(#arrow)" /><path d="M210,310 L1000,310" stroke="#244B68" stroke-width="4" fill="none"/><path d="M210,310 L210,350" stroke="#244B68" stroke-width="4" fill="none" marker-end="url(#arrow)" /><path d="M600,310 L600,350" stroke="#244B68" stroke-width="4" fill="none" marker-end="url(#arrow)" /><path d="M1000,310 L1000,350" stroke="#244B68" stroke-width="4" fill="none" marker-end="url(#arrow)" /><rect x="35" y="355" width="350" height="155" fill="#F3F3F3" stroke="#CCCCCC" stroke-width="2"/><text x="59" y="398" fill="#202020" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="59" dy="0">Kunnskap</tspan></text><text x="59" y="437" fill="#202020" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="59" dy="0">Sak eller område</tspan><tspan x="59" dy="32.5">Kilde og begrunnelse</tspan></text><rect x="425" y="355" width="350" height="155" fill="#F3F3F3" stroke="#CCCCCC" stroke-width="2"/><text x="449" y="398" fill="#202020" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="449" dy="0">Handling</tspan></text><text x="449" y="437" fill="#202020" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="449" dy="0">Valgt oppgavekø</tspan><tspan x="449" dy="32.5">Neste steg og sluttpunkt</tspan></text><rect x="815" y="355" width="350" height="155" fill="#F3F3F3" stroke="#CCCCCC" stroke-width="2"/><text x="839" y="398" fill="#202020" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="839" dy="0">Beslutning</tspan></text><text x="839" y="437" fill="#202020" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="839" dy="0">Riktig person avgjør</tspan><tspan x="839" dy="32.5">Forslag er fortsatt forslag</tspan></text><path d="M210,516 L210,566" stroke="#244B68" stroke-width="4" fill="none" marker-end="url(#arrow)" /><path d="M600,516 L600,566" stroke="#244B68" stroke-width="4" fill="none" marker-end="url(#arrow)" /><path d="M1000,516 L1000,566" stroke="#244B68" stroke-width="4" fill="none" marker-end="url(#arrow)" /><path d="M210,572 L1000,572" stroke="#244B68" stroke-width="4" fill="none"/><path d="M600,572 L600,617" stroke="#244B68" stroke-width="4" fill="none" marker-end="url(#arrow)" /><rect x="180" y="623" width="840" height="110" fill="#127C80" stroke="#127C80" stroke-width="2"/><text x="204" y="666" fill="white" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="204" dy="0">Kontroller resultat og konsekvenser</tspan></text><text x="204" y="705" fill="white" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="204" dy="0">Les tilbake. Oppdater berørt frist, status og ukeplan.</tspan></text></svg>